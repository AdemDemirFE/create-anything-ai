name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: jobs only read repository content. No secrets are used in
# this workflow, so it is safe for pull_request runs from fork branches.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate-catalog:
    name: Validate stacks catalog and schemas
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Validate JSON files parse
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          failures = []

          json_files = sorted(Path('.').glob('stacks/*.json')) + sorted(Path('.').glob('schemas/*.json'))
          if not json_files:
              # Bootstrap phase: stacks/ and schemas/ are added by other tasks
              # and may not exist on every branch yet.
              print('NOTE: no JSON files found under stacks/ or schemas/ yet; nothing to parse.')
              sys.exit(0)
          for path in json_files:
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except (json.JSONDecodeError, OSError) as exc:
                  failures.append(f'{path}: {exc}')

          if failures:
              for failure in failures:
                  print(f'ERROR: {failure}')
              sys.exit(1)
          print(f'OK: {len(json_files)} JSON file(s) parsed.')
          PY

      - name: Validate catalog rules
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          catalog_path = Path('stacks/catalog.json')
          if not catalog_path.is_file():
              # Bootstrap phase: the catalog lands with the stack-catalog
              # task and may not exist on every branch yet.
              print('NOTE: stacks/catalog.json does not exist yet; catalog rules skipped.')
              sys.exit(0)
          try:
              catalog = json.loads(catalog_path.read_text(encoding='utf-8'))
          except (json.JSONDecodeError, OSError) as exc:
              print(f'ERROR: catalog.json cannot be read: {exc}')
              sys.exit(1)

          failures = []

          stacks = catalog.get('stacks')
          if not isinstance(stacks, list) or not stacks:
              print('ERROR: catalog.stacks must be a non-empty list.')
              sys.exit(1)

          # Rule: exactly 40 stacks.
          if len(stacks) != 40:
              failures.append(f'Expected 40 stacks, found {len(stacks)}.')

          # Rule: unique ids.
          ids = [s.get('id') for s in stacks]
          duplicates = sorted({i for i in ids if ids.count(i) > 1})
          if duplicates:
              failures.append(f'Duplicate stack ids: {duplicates}')

          # Rule: id format (NN-lowercase-hyphen) and id == "NN-" + rest used by directory convention.
          import re
          id_pattern = re.compile(r'^[0-9]{2}-[a-z0-9]+(?:-[a-z0-9]+)*$')
          for sid in ids:
              if not isinstance(sid, str) or not id_pattern.match(sid):
                  failures.append(f'Invalid stack id format: {sid!r}')

          # Rule: numbers are 1..40 and unique.
          numbers = [s.get('number') for s in stacks]
          for n in numbers:
              if not isinstance(n, int) or isinstance(n, bool) or not (1 <= n <= 40):
                  failures.append(f'Stack number out of range 1-40: {n!r}')
          if len(set(numbers)) != len(numbers):
              dupes = sorted(n for n in numbers if numbers.count(n) > 1)
              failures.append(f'Duplicate stack numbers: {dupes}')

          # Rule: maturity values are allowed.
          allowed = catalog.get('maturityPolicy')
          if not isinstance(allowed, list) or not allowed:
              failures.append('catalog.maturityPolicy must be a non-empty list.')
              allowed = []
          for s in stacks:
              maturity = s.get('maturity')
              if maturity not in allowed:
                  failures.append(f'Stack {s.get("id")!r} has maturity {maturity!r} not in maturityPolicy.')

          # Rule: stack id must equal its stack directory name.
          stacks_dir = Path('stacks')
          for sid in ids:
              if not (stacks_dir / sid).is_dir():
                  failures.append(f'Stack id {sid!r} has no matching directory stacks/{sid}/.')

          # Rule: every stack directory contains a stack.json manifest.
          for sid in ids:
              if (stacks_dir / sid).is_dir() and not (stacks_dir / sid / 'stack.json').is_file():
                  failures.append(f'stacks/{sid}/stack.json is missing.')

          if failures:
              for failure in failures:
                  print(f'ERROR: {failure}')
              sys.exit(1)
          print(f'OK: {len(stacks)} stacks, unique ids, numbers 1-40, maturity values valid.')
          PY

      - name: Validate stack manifests against schema
        # Basic structural checks in pure Python (no jsonschema dependency):
        # required keys, id pattern, maturity enum, verification booleans.
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          id_pattern = re.compile(r'^[0-9]{2}-[a-z0-9]+(?:-[a-z0-9]+)*$')
          allowed_maturity = {
              'proposed', 'spec-ready', 'scaffolded', 'verified',
              'production-reference', 'blocked',
          }
          required = ['id', 'name', 'category', 'maturity', 'description', 'requires', 'verification']

          failures = []
          manifests = sorted(Path('stacks').glob('*/stack.json'))
          if not manifests:
              print('NOTE: no stack.json manifests exist yet; nothing to validate.')
              sys.exit(0)

          for path in manifests:
              try:
                  manifest = json.loads(path.read_text(encoding='utf-8'))
              except (json.JSONDecodeError, OSError) as exc:
                  failures.append(f'{path}: cannot parse: {exc}')
                  continue
              for key in required:
                  if key not in manifest:
                      failures.append(f'{path}: missing required key {key!r}')
              mid = manifest.get('id')
              if not (isinstance(mid, str) and id_pattern.match(mid)):
                  failures.append(f'{path}: invalid id {mid!r}')
              elif path.parent.name != mid:
                  failures.append(f'{path}: id {mid!r} does not match directory {path.parent.name!r}')
              if manifest.get('maturity') not in allowed_maturity:
                  failures.append(f'{path}: maturity {manifest.get("maturity")!r} not allowed')
              verification = manifest.get('verification')
              if not isinstance(verification, dict):
                  failures.append(f'{path}: verification must be an object')
              else:
                  for key in ('manifest', 'unit', 'integration', 'e2e'):
                      if not isinstance(verification.get(key), bool):
                          failures.append(f'{path}: verification.{key} must be a boolean')

          if failures:
              for failure in failures:
                  print(f'ERROR: {failure}')
              sys.exit(1)
          print(f'OK: {len(manifests)} manifest(s) checked against stack-manifest schema rules.')
          PY

      - name: Consistency check - schemas referenced by documentation exist
        # Simple file consistency check (no external link checker): the two
        # schema files that the catalog contract depends on must exist.
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          required_files = [
              'schemas/stack-manifest.schema.json',
              'schemas/generation-plan.schema.json',
              'stacks/catalog.json',
          ]
          # Bootstrap phase: the schema/catalog files land with other tasks.
          # A fully absent set is reported, not failed; a partially present
          # set (some exist, some missing) is still a failure because that
          # indicates an inconsistent tree.
          present = [f for f in required_files if Path(f).is_file()]
          if not present:
              print('NOTE: schema/catalog files do not exist yet; consistency check skipped.')
              sys.exit(0)
          failures = [f for f in required_files if f not in present]
          if failures:
              for failure in failures:
                  print(f'ERROR: missing required file: {failure}')
              sys.exit(1)
          print('OK: schema and catalog files present.')
          PY

      - name: Install jsonschema (full schema-validation engine)
        # validate_schemas.py falls back to a conservative stdlib subset
        # validator when jsonschema is absent; install the real engine so CI
        # exercises the same Draft 2020-12 validation the local runs use.
        run: python -m pip install jsonschema

      - name: Cross-artifact validation (Wave-2 validators + doc consistency)
        # TASK-026: the inline checks above verify catalog structure but not
        # manifest-vs-catalog maturity agreement (C08) or evidence reality
        # (C10/C11) - the drift class that silently reached main three times
        # (stacks 15, 15-again, 16). This step runs the independent Wave-2
        # validators plus the STACK_CATALOG.md-vs-catalog.json consistency
        # check (D01) so manifest/catalog/doc drift fails CI on the PR.
        run: python tests/integration/validate_cross_artifacts.py

  generator-tests:
    name: Generator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect generator package
        # The generator package is owned by another task and may not exist
        # yet. hashFiles is only available in step-scope expressions, so the
        # detection runs as a step and gates the setup/test steps instead.
        id: generator
        run: |
          if [ -f "packages/generator/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.generator.outputs.exists == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'packages/generator/package-lock.json'

      - name: Install dependencies
        if: ${{ steps.generator.outputs.exists == 'true' }}
        working-directory: packages/generator
        run: npm ci

      - name: Run tests
        if: ${{ steps.generator.outputs.exists == 'true' }}
        working-directory: packages/generator
        run: npm test

  # TASK-026: per-stack smoke gates. The fast layer of every implemented
  # stack runs on every push/PR as one async matrix job (fail-fast false so
  # one red stack does not hide the state of the others; per-job timeouts so
  # a hung suite cannot burn the 10-minute runner limit silently).
  #
  # Heavy toolchains (mvn/dotnet, stacks 01/35) and SDK-gated parts (Flutter,
  # Expo, Capacitor, Android) are deliberately NOT in this matrix: they are
  # marked non-critical or manual-trigger candidates (workflow_dispatch) and
  # their verification remains documented in stacks/<id>/verification.md.
  # Matrix axes are flat string pairs; the step dispatches on the `suite`
  # value only, so no nested-matrix expression is needed.
  stack-smoke:
    name: Stack smoke — ${{ matrix.stack }} (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Node/vitest build-bearing web + shared layers -----------------
          - stack: 08-supabase-react-vite
            suite: web
            path: stacks/08-supabase-react-vite/web
          - stack: 15-laravel12-vue3-inertia-flutter
            suite: web
            path: stacks/15-laravel12-vue3-inertia-flutter/laravel
          - stack: 16-laravel12-livewire-alpine-tailwind
            suite: web
            path: stacks/16-laravel12-livewire-alpine-tailwind/laravel
          - stack: 17-laravel12-react-inertia-reactnative
            suite: web+shared
            path: stacks/17-laravel12-react-inertia-reactnative/laravel
          - stack: 17-laravel12-react-inertia-reactnative
            suite: shared-ts
            path: stacks/17-laravel12-react-inertia-reactnative/shared
          - stack: 19-pevn-express-vue3-capacitor
            suite: server+shared+web
            path: stacks/19-pevn-express-vue3-capacitor
          - stack: 20-fastapi-react-vite-pwa
            suite: web
            path: stacks/20-fastapi-react-vite-pwa/frontend
          - stack: 36-go-gorilla-websockets-vue3
            suite: web
            path: stacks/36-go-gorilla-websockets-vue3/web
          # --- Go backends ----------------------------------------------------
          - stack: 04-go-fiber-htmx-flutter
            suite: go-test
            path: stacks/04-go-fiber-htmx-flutter/backend
          - stack: 36-go-gorilla-websockets-vue3
            suite: go-test
            path: stacks/36-go-gorilla-websockets-vue3/backend
          # --- Python backends -------------------------------------------------
          - stack: 20-fastapi-react-vite-pwa
            suite: pytest
            path: stacks/20-fastapi-react-vite-pwa/backend
          - stack: 21-django5-htmx-alpine-tailwind
            suite: django-test
            path: stacks/21-django5-htmx-alpine-tailwind/django
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js (vitest/build suites)
        if: ${{ matrix.suite == 'web' || matrix.suite == 'shared-ts' || matrix.suite == 'server+shared+web' }}
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python (pytest/django suites)
        if: ${{ matrix.suite == 'pytest' || matrix.suite == 'django-test' }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up Go (go-test suites)
        if: ${{ matrix.suite == 'go-test' }}
        uses: actions/setup-go@v7
        with:
          go-version-file: '${{ matrix.path }}/go.mod'
          cache-dependency-path: '${{ matrix.path }}/go.sum'

      - name: Node suite — npm ci + test + build
        # The 16/laravel package has no `test` script (its TALL suite runs in
        # PHP, not vitest); the production `vite build` (tailwind/Alpine via
        # PostCSS) is the verified JS artifact path there (verification.md
        # §188-196). Everything else in this arm has both scripts.
        if: ${{ matrix.suite == 'web' || matrix.suite == 'shared-ts' }}
        working-directory: ${{ matrix.path }}
        run: |
          npm ci
          if grep -q '"test"' package.json; then
            npm test
          else
            echo "NOTE: no test script in $PWD/package.json; build only."
          fi
          npm run build

      - name: Node suite — 19 server + shared + web (vitest + tsc)
        if: ${{ matrix.suite == 'server+shared+web' }}
        run: |
          for dir in server shared web; do
            echo "=== 19/$dir ==="
            npm ci --prefix "stacks/19-pevn-express-vue3-capacitor/$dir"
            npm test --prefix "stacks/19-pevn-express-vue3-capacitor/$dir"
            npm run build --prefix "stacks/19-pevn-express-vue3-capacitor/$dir"
          done

      - name: Go suite — go build + go vet + go test
        if: ${{ matrix.suite == 'go-test' }}
        working-directory: ${{ matrix.path }}
        run: |
          go build ./...
          go vet ./...
          go test ./... -count=1

      - name: Python suite — FastAPI pytest
        if: ${{ matrix.suite == 'pytest' }}
        working-directory: ${{ matrix.path }}
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pytest

      - name: Python suite — Django manage.py test
        if: ${{ matrix.suite == 'django-test' }}
        working-directory: ${{ matrix.path }}
        run: |
          python -m pip install "django>=5.2,<6.0"
          python manage.py test -v 1

  # Workflow self-validation (TASK-026 item 5): actionlint when available,
  # always a PyYAML syntax parse of every workflow file so a malformed
  # workflow fails CI instead of silently disabling the gates.
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PyYAML (workflow parse self-check dependency)
        # setup-python images do not ship PyYAML; the parse step below is a
        # required gate, so install it explicitly (same pattern as the
        # jsonschema install in validate-catalog).
        run: python -m pip install pyyaml

      - name: Install actionlint (best effort)
        # The official installer drops ./actionlint into the working
        # directory and exits 0 even when it cannot install; add the working
        # directory to PATH when the binary appears, and record the
        # unavailability flag only on real installer failures so the next
        # step never dies with exit 127 ("command not found").
        run: |
          if command -v actionlint >/dev/null 2>&1; then
            echo "actionlint already present: $(command -v actionlint)"
          else
            bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) \
              || echo "ACTIONLINT_UNAVAILABLE=true" >> "$GITHUB_ENV"
          fi
          if [ -x ./actionlint ]; then
            echo "$PWD" >> "$GITHUB_PATH"
            ./actionlint --version
          fi

      - name: Run actionlint (when installed)
        if: ${{ env.ACTIONLINT_UNAVAILABLE != 'true' }}
        # Double guard: the env flag alone proved insufficient (the
        # installer exits 0 without installing); only invoke actionlint when
        # it really is on PATH, otherwise skip with a note - the PyYAML
        # self-check below still validates the workflow syntax.
        run: |
          if command -v actionlint >/dev/null 2>&1; then
            actionlint -color
          else
            echo "actionlint is not on PATH; skipping structured lint (the YAML parse self-check still runs)."
          fi

      - name: YAML parse all workflows (always runs)
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          try:
              import yaml
          except ImportError:
              print('ERROR: PyYAML not available; cannot parse workflows.')
              sys.exit(1)
          workflows = sorted(Path('.github/workflows').glob('*.yml'))
          if not workflows:
              print('ERROR: no workflow files found under .github/workflows/.')
              sys.exit(1)
          failures = []
          for wf in workflows:
              try:
                  yaml.safe_load(wf.read_text(encoding='utf-8'))
                  print(f'OK: {wf} parses as YAML.')
              except (yaml.YAMLError, OSError) as exc:
                  failures.append(f'{wf}: {exc}')
          if failures:
              for failure in failures:
                  print(f'ERROR: {failure}')
              sys.exit(1)
          print(f'OK: {len(workflows)} workflow file(s) parsed.')
          PY

  # Optional summary job: makes branch protection easy by giving a single
  # "required check" that reflects both jobs, including skipped states.
  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [validate-catalog, generator-tests, stack-smoke, workflow-lint]
    if: ${{ always() }}
    steps:
      - name: Summarize job results
        run: |
          echo "validate-catalog: ${{ needs.validate-catalog.result }}"
          echo "generator-tests: ${{ needs.generator-tests.result }}"
          echo "stack-smoke: ${{ needs.stack-smoke.result }}"
          echo "workflow-lint: ${{ needs.workflow-lint.result }}"
          if [ "${{ needs.validate-catalog.result }}" != "success" ]; then
            echo "CI failed: validate-catalog did not succeed."
            exit 1
          fi
          if [ "${{ needs.generator-tests.result }}" != "success" ] && [ "${{ needs.generator-tests.result }}" != "skipped" ]; then
            echo "CI failed: generator-tests did not succeed or get skipped."
            exit 1
          fi
          if [ "${{ needs.stack-smoke.result }}" != "success" ] && [ "${{ needs.stack-smoke.result }}" != "skipped" ]; then
            echo "CI failed: stack-smoke did not succeed (a stack's fast layer is red)."
            exit 1
          fi
          if [ "${{ needs.workflow-lint.result }}" != "success" ]; then
            echo "CI failed: workflow-lint did not succeed."
            exit 1
          fi
          echo "CI summary: all required checks passed."
