name: Secret audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Periodic full-history scan: removing a secret from the latest commit
  # does not remove it from history (see docs/SECURITY_GIT_RULES.md).
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

# Least privilege: the scan only reads repository content. No repository
# secrets are required for personal-account repositories (GITLEAKS_LICENSE is
# only needed for organization-owned repos and is intentionally not referenced
# here so fork pull_request runs never touch secrets).
permissions:
  contents: read

concurrency:
  group: secret-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so the scan covers past commits, not just the latest.
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
