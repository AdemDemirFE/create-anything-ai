{% if result %}
  <div class="rounded-lg border border-slate-200 bg-white p-4" data-testid="run-result">
    <div class="mb-2 flex items-center justify-between">
      <p class="font-medium">{{ result.algorithm }}</p>
      <p class="text-xs text-slate-500">
        <span class="font-medium text-slate-700">Measured duration:</span> {{ result.durationMs }} ms
        <span class="mx-2 text-slate-300">|</span>
        <span class="font-medium text-slate-700">Theoretical complexity:</span> {{ result.complexity }}
      </p>
    </div>
    <pre class="max-h-72 overflow-auto rounded bg-slate-900 p-3 text-xs text-slate-100">{{ result.output }}</pre>
  </div>
{% elif form.errors %}
  <div role="alert" class="rounded-md border border-red-300 bg-red-50 px-4 py-2 text-sm text-red-900">
    Fix the highlighted fields and run again.
  </div>
{% endif %}
