{{define "login"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — Stack 04</title>
  <script src="/static/htmx.min.js" defer></script>
  <style>
    :root { font-family: system-ui, sans-serif; }
    body { max-width: 44rem; margin: 0 auto; padding: 1.5rem; color: #1c2733; background: #f7f9fb; }
    header nav a { margin-right: 1rem; }
    .card { background: #fff; border: 1px solid #d7dee6; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    .error { color: #b42318; background: #fef3f2; border: 1px solid #f4c7c3; border-radius: 6px; padding: .5rem .75rem; margin: .5rem 0; }
    .flash { color: #067647; background: #ecfdf3; border: 1px solid #abefc6; border-radius: 6px; padding: .5rem .75rem; margin: .5rem 0; }
    .field-error { color: #b42318; font-size: .875rem; }
    label { display: block; font-weight: 600; margin-top: .75rem; }
    input, textarea, select { width: 100%; padding: .5rem; margin-top: .25rem; border: 1px solid #98a2b3; border-radius: 6px; box-sizing: border-box; }
    button { margin-top: 1rem; padding: .5rem 1.25rem; background: #175cd3; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button[disabled] { opacity: .6; cursor: wait; }
    .muted { color: #52667a; font-size: .875rem; }
    footer { margin-top: 2rem; color: #52667a; font-size: .8125rem; }
  </style>
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="/">Home</a>
      <a href="/register">Register</a>
      <a href="/login">Log in</a>
    </nav>
  </header>
  <main>
    {{if .Flash}}<div class="flash" role="status">{{.Flash}}</div>{{end}}
    <h1>Log in</h1>
    <div class="card">
      {{template "login-form" .}}
      <p class="muted">No account? <a href="/register">Register</a>.</p>
    </div>
  </main>
  <footer>Stack 04 — Go / Fiber / htmx / Flutter reference implementation (server-rendered, no SPA).</footer>
</body>
</html>{{end}}
