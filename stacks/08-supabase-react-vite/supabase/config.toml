# Supabase local project config (stack 08).
# Used by the Supabase CLI: `supabase start` requires Docker; `supabase db reset`
# applies everything in supabase/migrations and then seed.sql. Docker was not
# available in this workspace, so this file is committed as the documented,
# unverified-in-runtime configuration (see verification.md).

project_id = "create-anything-ai-stack08"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:4173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Email confirmation is disabled so the reference four-screen flow (register ->
# login) works end-to-end without an SMTP server. Production setups should
# enable confirmation and adjust this file.
enable_confirmations = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

# No SMTP in the reference environment; confirmation mails are only printed to
# the Studio "Emails" view / logs by the local runner.
[auth.smtp]

[analytics]
enabled = false

[inbound_email]
enabled = false
