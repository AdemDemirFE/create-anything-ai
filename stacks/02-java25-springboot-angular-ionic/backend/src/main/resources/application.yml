# ---------------------------------------------------------------------------
# Reference Stack 02 backend defaults (profile-specific values below).
# Secrets are never committed: compose/.env injects real values locally.
# ---------------------------------------------------------------------------
spring:
  application:
    name: stack02-backend
  jackson:
    default-property-inclusion: always

server:
  port: 8080
  servlet:
    session:
      cookie:
        name: STACK02_SESSION
        http-only: true
        same-site: lax
        secure: false   # set true behind TLS (production profile)
      timeout: 30m      # documented session lifetime (ARCHITECTURE.md)

app:
  cors:
    # Comma-separated allowlist; override via the ALLOWED_ORIGINS env var
    # (documented in .env.example). Angular dev server origin is the default.
    allowed-origins: http://localhost:4200,http://127.0.0.1:4200
  trusted-proxies: ""  # XFF is IGNORED unless set (see AuthService / ARCHITECTURE.md)
  throttle:
    # Login + register throttle bounds and the advertised Retry-After:
    # config-driven, operators tune without code changes (ThrottleProperties).
    login-max-failed-attempts: 10
    login-window-seconds: 60
    register-max-per-window: 30
    register-window-seconds: 60
    retry-after-seconds: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

---
# Development profile: H2 in-memory + Flyway-managed schema, H2 console on.
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:stack02;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Test profile: isolated H2 database per test context.
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:stack02_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

---
# Production profile: PostgreSQL via environment; requires a real secret.
# Startup fails fast if SPRING_DATASOURCE_PASSWORD is missing.
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  servlet:
    session:
      cookie:
        secure: true

app:
  throttle:
    retry-after-seconds: 60
